name: Agent evaluations

on:
  pull_request:
    paths:
      - "backend/app/evaluation/**"
      - "backend/app/core/metrics.py"
      - "backend/app/stages/stage4_interview/**"
      - "backend/scripts/run_agent_evals.py"
      - "data/evaluation/agent_evals/**"
      - ".github/workflows/agent-evals.yml"
  push:
    paths:
      - "backend/app/evaluation/**"
      - "backend/app/core/metrics.py"
      - "backend/app/stages/stage4_interview/**"
      - "backend/scripts/run_agent_evals.py"
      - "backend/scripts/report_agent_evals.py"
      - "data/evaluation/agent_evals/**"
      - ".github/workflows/agent-evals.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install evaluation dependency
        run: python -m pip install "pydantic>=2,<3"
      - name: Run labeled agent evaluations
        run: python backend/scripts/run_agent_evals.py
